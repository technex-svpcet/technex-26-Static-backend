<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DesignX Workshop Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap");

    :root {
      --accent: #0088ff;
      --dark-bg: #050505;
      --input-bg: #0d0d0d;
      --text: #ffffff;
    }

    body {
      margin: 0;
      background: var(--dark-bg);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
    }

    .page-wrap {
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .container-card {
      width: 100%;
      max-width: 650px;
      background: #0a0a0a;
      padding: 32px 28px;
      border-radius: 12px;
      border: 2px solid var(--accent);
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 32px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.2);
      background: #0d0d0d;
      color: white;
    }

    .member {
      background: #0f0f0f;
      padding: 16px;
      margin-bottom: 20px;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.15);
    }

    .member h3 {
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border-radius: 10px;
      color: black;
      font-size: 18px;
      font-weight: 700;
      border: none;
    }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.3);
      border-top: 2px solid rgba(0,0,0,0.8);
      margin-left: 8px;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .popup {
      position: fixed;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background: rgba(0,255,0,0.8);
      border-radius: 10px;
      transition: 0.4s;
      z-index: 99;
      font-weight: 700;
    }

    .popup.error {
      background: rgba(255,0,0,0.8);
    }

    .popup.show {
      bottom: 30px;
    }

    /* Overlay */
    .registration-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease-in;
      pointer-events: none;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .overlay-container {
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(0, 136, 255, 0.08) 100%);
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 136, 255, 0.2), inset 0 0 30px rgba(0, 136, 255, 0.05);
      width: 90%;
      max-width: 550px;
      border: 2px solid var(--accent);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .overlay-container img {
      width: 90px;
      height: 90px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 15px rgba(0, 136, 255, 0.5));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        filter: drop-shadow(0 0 15px rgba(0, 136, 255, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(0, 136, 255, 0.8));
      }
    }

    .overlay-container h1 {
      margin: 0 0 15px;
      font-size: 2.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 136, 255, 0.7);
    }

    .overlay-container h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: white;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .overlay-container {
        padding: 40px 25px;
        width: 95%;
      }
      
      .overlay-container img {
        width: 70px;
        height: 70px;
        margin-bottom: 20px;
      }
      
      .overlay-container h1 {
        font-size: 2.2rem;
        letter-spacing: 2px;
      }
      
      .overlay-container h2 {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

<!-- Registration Closed Overlay -->
<div class="registration-overlay" id="registrationOverlay">
  <div class="overlay-container">
    <img src="https://raw.githubusercontent.com/Vedant11054/bg-img/main/logo.webp" alt="TECHNEX Logo">
    <h1>Registration Closed</h1>
    <h2>Technex 25-26</h2>
  </div>
</div>

<div id="popup" class="popup"><p id="popupMessage" style="margin:0;"></p></div>

<div class="page-wrap">
  <div class="container-card">

    <h1>DesignX Workshop</h1>

    <form id="registrationForm" action="/submit-workshop" method="POST" enctype="multipart/form-data">

      <input type="hidden" name="teamSize" value="1">

      <label>Workshop Name</label>
      <input type="text" name="workshopname" value="designx" readonly />

      <!-- <label>Team Name</label>
      <input type="text" name="teamName" required /> -->

      <div class="member">
        <h3>Participant Details</h3>

        <input type="text" name="name1" placeholder="Full Name" required />
        <input type="email" name="email1" placeholder="Email" required />
        <input type="tel" name="phone1" placeholder="Phone Number" maxlength="10" required />

        <select name="year1" required>
          <option value="">Select Year</option>
          <option value="I">I Year</option>
          <option value="II">II Year</option>
          <option value="III">III Year</option>
          <option value="IV">IV Year</option>
        </select>

        <input type="text" name="branch1" placeholder="Branch" required />

        <select name="college1" onchange="toggleCollegeOther(this)" required>
          <option value="">Select College</option>
          <option value="SVPCET, Nagpur">SVPCET, Nagpur</option>
          <option value="Other">Other</option>
        </select>

        <input type="text" id="customCollege1" name="customCollege1" placeholder="Enter College Name" style="display:none;" />
      </div>

      <label>QR Code</label>
      <div style="text-align:center;">
        <img src="/api/payment-qr" width="150" />
      </div>

      <label>Amount</label>
      <input type="text" name="amount" value="150" readonly />

      <label>Transaction ID</label>
      <input type="text" name="transactionid" required />

      <label>Payment Screenshot</label>
      <input type="file" id="paymentScreenshot" name="paymentScreenshot" accept="image/*" required />
      <p style="color:#ff4d4d;font-size:13px;margin-top:-10px;">* Upload &lt; 500 KB</p>

      <button class="button" type="submit">
        <span id="buttonText">Submit</span>
        <span id="loadingSpinner" class="spinner"></span>
      </button>

    </form>
  </div>
</div>

<script>
function toggleCollegeOther(select) {
  const other = document.getElementById("customCollege1");
  other.style.display = select.value === "Other" ? "block" : "none";
  other.required = select.value === "Other";
}

function showPopup(msg, ok = true) {
  const popup = document.getElementById("popup");
  document.getElementById("popupMessage").textContent = msg;
  popup.classList.toggle("error", !ok);
  popup.classList.add("show");
  setTimeout(() => popup.classList.remove("show"), 3000);
}

document.getElementById("registrationForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const phone = document.querySelector("input[name='phone1']").value.trim();
  if (phone.length !== 10 || isNaN(phone)) {
    showPopup("Enter a valid 10-digit phone number!", false);
    return;
  }

  const file = document.getElementById("paymentScreenshot").files[0];
  if (file && file.size > 500 * 1024) {
    showPopup("File must be under 500 KB!", false);
    return;
  }

  const FD = new FormData(this);

  // Replace "Other" with actual college name
  if (FD.get("college1") === "Other") {
    FD.set("college1", FD.get("customCollege1").trim());
  }

  // Send transaction ID in all possible keys
  const txn = FD.get("transactionid").trim();
  FD.set("transactionid", txn);
  FD.set("txnid", txn);
  FD.set("transactionId", txn);
  FD.set("transactionID", txn);

  const btn = document.querySelector("button");
  document.getElementById("buttonText").style.display = "none";
  document.getElementById("loadingSpinner").style.display = "inline-block";
  btn.disabled = true;

  try {
    const res = await fetch(this.action, { method: "POST", body: FD });

    if (res.ok) {
      window.location.href = "/workshop-success?workshop=designx";
    } else {
      showPopup("Registration failed!", false);
    }
  } catch {
    showPopup("Network error!", false);
  }

  btn.disabled = false;
  document.getElementById("buttonText").style.display = "inline";
  document.getElementById("loadingSpinner").style.display = "none";
});
</script>

</body>
</html>
