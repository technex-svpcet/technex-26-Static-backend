<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coastal Clash Workshop Registration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&display=swap");

    :root {
      --accent: #06b6d4;
      --dark-bg: #050505;
      --input-bg: #0d0d0d;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--dark-bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
    }

    input.invalid, select.invalid {
      border-color: red !important;
      box-shadow: 0 0 6px red !important;
    }

    .page-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .container-card {
      width: 100%;
      max-width: 650px;
      background: #0a0a0a;
      padding: 32px 28px;
      border-radius: 10px;
      border: 2px solid var(--accent);
    }

    h1 {
      text-align: center;
      color: var(--accent);
      font-size: 32px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: var(--input-bg);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: white;
    }

    .member {
      background: #0f0f0f;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 16px;
    }

    .member h3 {
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: black;
      border-radius: 10px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .popup {
      position: fixed;
      bottom: -80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 18px;
      border-radius: 8px;
      background: red;
      color: white;
      transition: 0.4s;
      font-size: 15px;
    }

    .popup.show {
      bottom: 22px;
    }

    /* Overlay */
    .registration-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .overlay-container {
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(6, 182, 212, 0.08) 100%);
      padding: 50px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(6, 182, 212, 0.2), inset 0 0 30px rgba(6, 182, 212, 0.05);
      width: 90%;
      max-width: 550px;
      border: 2px solid var(--accent);
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .overlay-container img {
      width: 90px;
      height: 90px;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.5));
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.5));
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(6, 182, 212, 0.8));
      }
    }

    .overlay-container h1 {
      margin: 0 0 15px;
      font-size: 2.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(6, 182, 212, 0.7);
    }

    .overlay-container h2 {
      margin: 0;
      font-size: 2rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: white;
      font-family: 'Rajdhani', sans-serif;
    }

    /* Disabled Form State */
    form.disabled input,
    form.disabled select,
    form.disabled .button {
      opacity: 0.6;
      cursor: not-allowed;
    }

    form.disabled input:focus,
    form.disabled select:focus {
      border-color: rgba(6, 182, 212, 0.15);
      box-shadow: none;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .overlay-container {
        padding: 40px 25px;
        width: 95%;
      }
      
      .overlay-container img {
        width: 70px;
        height: 70px;
        margin-bottom: 20px;
      }
      
      .overlay-container h1 {
        font-size: 2.2rem;
        letter-spacing: 2px;
      }
      
      .overlay-container h2 {
        font-size: 1.6rem;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>

<!-- Registration Closed Overlay -->
<div class="registration-overlay" id="registrationOverlay">
  <div class="overlay-container">
    <img src="https://raw.githubusercontent.com/Vedant11054/bg-img/main/logo.webp" alt="TECHNEX Logo">
    <h1>Registration Closed</h1>
    <h2>Technex 25-26</h2>
  </div>
</div>

<div id="popup" class="popup"></div>

<div class="page-wrap">
  <div class="container-card">

    <h1>Coastal Clash Workshop</h1>

    <form id="registrationForm" action="/submit-workshop" method="POST" enctype="multipart/form-data" class="disabled">

      <label>Workshop Name</label>
      <input type="text" name="workshopname" value="coastalclash" readonly required />

      <label>Team Name</label>
      <input type="text" id="teamName" name="teamName" required />

      <label>Team Size</label>
      <select id="teamSize" name="teamSize" onchange="updateFields()" required>
        <option value="" disabled selected>Select Team Size</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>

      <label>Select Category of Kit</label>
      <select id="category" name="category" onchange="updateAmount()" required>
        <option value="" disabled selected>Select Option</option>
        <option value="No Kit">No Kit</option>
        <option value="Include Kit (+1500)">Include Kit (+1500)</option>
      </select>

      <div id="teamMembers"></div>

      <div id="qrBlock" style="text-align:center;">
        <img src="/api/payment-qr" width="150" height="150" />
      </div>

      <div id="txnBlock">
        <label>Transaction ID</label>
        <input type="text" id="transactionid" name="transactionid" />
      </div>

      <label>Amount</label>
      <input type="text" id="amount" name="amount" value="0" readonly />

      <div id="screenshotBlock">
        <label>Payment Screenshot</label>
        <input type="file" id="paymentScreenshot" name="paymentScreenshot" accept="image/*" />
        <p style="color:red;font-size:13px;"><b>* Upload file less than 500 KB</b></p>
      </div>

      <button class="button" type="submit">Pay & Register</button>

    </form>

  </div>
</div>

<script>
// -------- Show popup ----------
function showPopup(msg) {
  const popup = document.getElementById("popup");
  popup.textContent = msg;
  popup.classList.add("show");
  setTimeout(() => popup.classList.remove("show"), 2500);
}

// -------- Generate Member Fields ----------
function updateFields() {
  const size = Number(document.getElementById("teamSize").value);
  const box = document.getElementById("teamMembers");
  box.innerHTML = "";

  for (let i = 1; i <= size; i++) {
    box.innerHTML += `
      <div class="member">
        <h3>Member ${i}</h3>
        <input type="text" name="name${i}" placeholder="Full Name" required>
        <input type="email" name="email${i}" placeholder="Email" required>
        <input type="tel" name="phone${i}" placeholder="Phone Number" required>
        <input type="text" name="year${i}" placeholder="Year (1-4)" required>
        <input type="text" name="branch${i}" placeholder="Branch" required>
        <input type="text" name="college${i}" placeholder="College Name" required>
      </div>`;
  }
}

// -------- Update Payment Visibility ----------
function updateAmount() {
  const category = document.getElementById("category").value;

  document.getElementById("qrBlock").style.display =
  document.getElementById("txnBlock").style.display =
  document.getElementById("screenshotBlock").style.display =
    category === "Include Kit (+1500)" ? "block" : "none";

  document.getElementById("amount").value =
    category === "Include Kit (+1500)" ? 1500 : 0;
}

// -------- Validation Function ----------
function validateForm() {
  // Reset all invalid states
  document.querySelectorAll("input, select").forEach(el => el.classList.remove("invalid"));

  const teamName = document.getElementById("teamName");
  if (!/^[A-Za-z0-9 ]{3,}$/.test(teamName.value)) {
    teamName.classList.add("invalid");
    showPopup("Enter a valid Team Name (min 3 characters)");
    return false;
  }

  const teamSize = document.getElementById("teamSize");
  if (teamSize.value === "") {
    teamSize.classList.add("invalid");
    showPopup("Team size is mandatory");
    return false;
  }

  const category = document.getElementById("category");
  if (category.value === "") {
    category.classList.add("invalid");
    showPopup("Please select a category");
    return false;
  }

  // Validate each member
  const members = document.querySelectorAll(".member");
  for (let member of members) {
    const inputs = member.querySelectorAll("input");

    for (let input of inputs) {
      const val = input.value.trim();

      if (input.name.includes("name") && !/^[A-Za-z ]{3,}$/.test(val)) {
        input.classList.add("invalid");
        showPopup("Invalid Name (letters only, min 3 chars)");
        return false;
      }

      if (input.name.includes("email") && !/\S+@\S+\.\S+/.test(val)) {
        input.classList.add("invalid");
        showPopup("Invalid Email");
        return false;
      }

      if (input.name.includes("phone") && !/^\d{10}$/.test(val)) {
        input.classList.add("invalid");
        showPopup("Phone number must be exactly 10 digits");
        return false;
      }

      if (input.name.includes("year") && !/^[1-4]$/.test(val)) {
        input.classList.add("invalid");
        showPopup("Year must be between 1–4");
        return false;
      }

      if (input.name.includes("branch") && val.length < 2) {
        input.classList.add("invalid");
        showPopup("Branch name too short");
        return false;
      }

      if (input.name.includes("college") && val.length < 3) {
        input.classList.add("invalid");
        showPopup("Enter a valid College Name");
        return false;
      }
    }
  }

  // Validate payment fields when kit selected
  if (category.value === "Include Kit (+1500)") {
    const txn = document.getElementById("transactionid");
    if (txn.value.trim().length < 6) {
      txn.classList.add("invalid");
      showPopup("Enter a valid Transaction ID");
      return false;
    }

    const file = document.getElementById("paymentScreenshot").files[0];
    if (!file) {
      showPopup("Payment screenshot is required");
      return false;
    }

    if (file.size > 500 * 1024) {
      showPopup("Screenshot must be less than 500 KB");
      return false;
    }
  }

  return true;
}


// -------- Submit Handler ----------
document.getElementById("registrationForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  if (!validateForm()) return;

  try {
    const res = await fetch(this.action, {
      method: "POST",
      body: new FormData(this)
    });

    if (res.ok) {
      window.location.href = "/workshop-success?workshop=coastalclash";
    } else {
      showPopup("Registration failed. Try again.");
    }

  } catch {
    showPopup("Network error. Try again.");
  }
});
</script>

</body>
</html>
